services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printpoint}
      POSTGRES_DB: printpoint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://printpoint:${POSTGRES_PASSWORD:-printpoint}@db:5432/printpoint?schema=public
      CORS_ORIGINS: ${APP_URL:-http://localhost:4000}
      APP_URL: ${APP_URL:-http://localhost:4000}
      UPLOAD_DIR: /app/uploads
      # Dev-only fallbacks so `docker compose up` works out of the box.
      # Override with real secrets via backend/.env or shell env before deploying.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me-0123456789abcdef}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
